<h5 class="mb-3">Nouvelle licence logicielle</h5>

@if (error) {
  <div class="alert alert-danger">{{ error }}</div>
}

<form [formGroup]="form" (ngSubmit)="submit()" class="card p-4" style="max-width: 700px;">
  <div class="row g-3">
    <div class="col-12">
      <label class="form-label">Logiciel</label>
      <select class="form-select" formControlName="logiciel">
        <option [ngValue]="null">Sélectionner...</option>
        @for (logiciel of logiciels; track logiciel.id) {
          <option [ngValue]="logiciel.id">{{ logiciel.libelle }}</option>
        }
      </select>
    </div>

    <div class="col-md-6">
      <label class="form-label">N° de licence</label>
      <input type="text" class="form-control" formControlName="numeroLicence" />
    </div>
    <div class="col-md-6">
      <label class="form-label">Date de début</label>
      <input type="date" class="form-control" formControlName="dateDebut" />
    </div>
    <div class="col-md-6">
      <label class="form-label">Durée de la licence</label>
      <select class="form-select" formControlName="dureeMois">
        <option [ngValue]="null">Sans expiration</option>
        <option [ngValue]="12">1 an (12 mois)</option>
        <option [ngValue]="24">2 ans (24 mois)</option>
        <option [ngValue]="36">3 ans (36 mois)</option>
      </select>
      <div class="form-text">La date d'expiration est calculée à partir de la date de début.</div>
    </div>

    <div class="col-md-6">
      <label class="form-label">Fournisseur</label>
      <input type="text" class="form-control" formControlName="fournisseur" />
    </div>

    <div class="col-12">
      <label class="form-label">Observations</label>
      <textarea class="form-control" rows="2" formControlName="observations"></textarea>
    </div>
  </div>

  <div class="mt-3 d-flex gap-2">
    <button type="submit" class="btn btn-primary" [disabled]="saving">
      <i class="bi bi-check-lg"></i> Enregistrer
    </button>
    <a routerLink="/licences-logicielles" class="btn btn-outline-secondary">Annuler</a>
  </div>
</form>
