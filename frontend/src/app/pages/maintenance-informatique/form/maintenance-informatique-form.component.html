<app-page-header title="Nouvelle intervention de maintenance"></app-page-header>

@if (error) {
  <div class="alert alert-danger">{{ error }}</div>
}

<app-panel>
<form [formGroup]="form" (ngSubmit)="submit()" style="max-width: 800px;">
  <div class="row g-3">
    <div class="col-md-6">
      <label class="form-label">Matériel</label>
      <app-searchable-select formControlName="materiel" nullLabel="Sélectionner..." placeholder="Rechercher un matériel..." [options]="materielOptions" />
    </div>
    <div class="col-md-6">
      <label class="form-label">Type</label>
      <select class="form-select" formControlName="type">
        <option [ngValue]="null">Sélectionner...</option>
        @for (type of typesMaintenance; track type.id) {
          <option [ngValue]="type.id">{{ type.libelle }}</option>
        }
      </select>
    </div>

    <div class="col-12">
      <label class="form-label">Description</label>
      <textarea class="form-control" rows="2" formControlName="description"></textarea>
    </div>

    <div class="col-md-6">
      <label class="form-label">Date de réalisation</label>
      <input type="date" class="form-control" formControlName="dateRealisation" />
    </div>

    <div class="col-md-6">
      <label class="form-label">Réalisé par (technicien interne)</label>
      <app-searchable-select formControlName="realisePar" nullLabel="Non renseigné" placeholder="Rechercher un agent..." [options]="personnelOptions" />
    </div>
    <div class="col-md-6">
      <label class="form-label">Ou prestataire externe</label>
      <input type="text" class="form-control" formControlName="prestataireExterne" placeholder="Nom du prestataire" />
    </div>

    <div class="col-12">
      <label class="form-label">Ticket d'incident lié (optionnel)</label>
      <select class="form-select" formControlName="ticketOrigine">
        <option [ngValue]="null">Aucun</option>
        @for (ticket of tickets; track ticket.id) {
          <option [ngValue]="ticket.id">{{ ticket.titre }}</option>
        }
      </select>
    </div>

    <div class="col-12">
      <label class="form-label">Observations</label>
      <textarea class="form-control" rows="2" formControlName="observations"></textarea>
    </div>
  </div>

  <div class="mt-3 d-flex gap-2">
    <button type="submit" class="btn btn-primary" [disabled]="saving">
      <i class="bi bi-check-lg"></i> Enregistrer
    </button>
    <a routerLink="/maintenance-informatique" class="btn btn-outline-secondary">Annuler</a>
  </div>
</form>
</app-panel>
