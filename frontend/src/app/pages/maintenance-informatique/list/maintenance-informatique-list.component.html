<app-page-header title="Maintenance" subtitle="Journal des interventions réalisées sur le parc.">
  <a routerLink="/maintenance-informatique/new" class="btn btn-primary btn-sm">
    <i class="bi bi-plus-lg"></i> Nouvelle intervention
  </a>
</app-page-header>

@if (loading) {
  <p class="text-muted">Chargement...</p>
} @else if (error) {
  <div class="alert alert-danger">{{ error }}</div>
} @else {
  <app-data-table [rows]="maintenances" [columns]="columns" emptyMessage="Aucune intervention enregistrée." searchPlaceholder="Rechercher une intervention...">
    <ng-template appDataTableCell="materiel" let-maintenance>{{ materielLabel(maintenance) }}</ng-template>
    <ng-template appDataTableCell="type" let-maintenance>
      <span class="status-dot status-dot-{{ badgeClasseType(maintenance) }}">{{ typeLabel(maintenance) }}</span>
    </ng-template>
    <ng-template appDataTableCell="description" let-maintenance>{{ maintenance.description }}</ng-template>
    <ng-template appDataTableCell="realisePar" let-maintenance>{{ realiseParLabel(maintenance) }}</ng-template>
    <ng-template appDataTableCell="date" let-maintenance>{{ maintenance.dateRealisation | slice: 0 : 10 }}</ng-template>
    <ng-template appDataTableCell="actions" let-maintenance>
      <button type="button" class="btn btn-sm btn-outline-danger" (click)="supprimer(maintenance)">
        <i class="bi bi-trash"></i>
      </button>
    </ng-template>
  </app-data-table>
}
