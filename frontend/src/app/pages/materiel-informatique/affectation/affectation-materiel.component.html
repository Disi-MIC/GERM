<app-page-header title="Affectation du matériel" subtitle="Attribuer ou retirer le matériel informatique à un agent."></app-page-header>

@if (loading) {
  <p class="text-muted">Chargement...</p>
} @else if (error) {
  <div class="alert alert-danger">{{ error }}</div>
} @else {
  <div class="d-flex flex-wrap gap-2 mb-3">
    <button
      type="button"
      class="btn btn-sm"
      [class.btn-outline-secondary]="filtre !== 'non_affectes'"
      [class.btn-secondary]="filtre === 'non_affectes'"
      (click)="filtrer('non_affectes')"
    >
      Non affectés <span class="badge bg-light text-dark ms-1">{{ compteurs.non_affectes }}</span>
    </button>
    <button
      type="button"
      class="btn btn-sm"
      [class.btn-outline-secondary]="filtre !== 'affectes'"
      [class.btn-secondary]="filtre === 'affectes'"
      (click)="filtrer('affectes')"
    >
      Affectés <span class="badge bg-light text-dark ms-1">{{ compteurs.affectes }}</span>
    </button>
    <button
      type="button"
      class="btn btn-sm"
      [class.btn-outline-secondary]="filtre !== 'tous'"
      [class.btn-secondary]="filtre === 'tous'"
      (click)="filtrer('tous')"
    >
      Tous <span class="badge bg-light text-dark ms-1">{{ compteurs.tous }}</span>
    </button>
  </div>

  <app-data-table [rows]="materielsAffiches" [columns]="columns" emptyMessage="Aucun matériel dans cette catégorie." searchPlaceholder="Rechercher un matériel...">
    <ng-template appDataTableCell="numeroInventaire" let-materiel>{{ materiel.numeroInventaire }}</ng-template>
    <ng-template appDataTableCell="numeroSerie" let-materiel>{{ materiel.numeroSerie || '—' }}</ng-template>
    <ng-template appDataTableCell="materiel" let-materiel>{{ libelle(materiel.type) }} — {{ materiel.marque }} {{ materiel.modele }}</ng-template>
    <ng-template appDataTableCell="service" let-materiel>{{ serviceLabel(materiel) }}</ng-template>
    <ng-template appDataTableCell="affectationActuelle" let-materiel>{{ affecteLabel(materiel) }}</ng-template>
    <ng-template appDataTableCell="affecterA" let-materiel>
      <app-searchable-select
        [(ngModel)]="selections[materiel.id!]"
        nullLabel="En stock (aucun)"
        placeholder="Rechercher un agent..."
        [options]="personnelOptions"
      />
    </ng-template>
    <ng-template appDataTableCell="action" let-materiel>
      <button
        type="button"
        class="btn btn-sm btn-primary"
        [disabled]="selectionInchangee(materiel) || saving[materiel.id!]"
        (click)="affecter(materiel)"
      >
        Affecter
      </button>
    </ng-template>
  </app-data-table>
}
