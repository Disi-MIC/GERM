<app-page-header [title]="(congeId ? 'Modifier' : 'Nouveau') + ' congé'"></app-page-header>

@if (loading) {
  <p class="text-muted">Chargement...</p>
} @else {
  @if (error) {
    <div class="alert alert-danger">{{ error }}</div>
  }

  <app-panel>
  <form [formGroup]="form" (ngSubmit)="submit()" style="max-width: 700px;">
    <div class="row g-3">
      <div class="col-12">
        <label class="form-label">Agent</label>
        <app-searchable-select formControlName="personnel" nullLabel="Sélectionner..." placeholder="Rechercher un agent..." [options]="personnelOptions" />
      </div>

      <div class="col-md-4">
        <label class="form-label">Type de congé</label>
        <select class="form-select" formControlName="type">
          <option value="annuel">Congé annuel</option>
          <option value="maladie">Congé maladie</option>
          <option value="maternite_paternite">Congé maternité / paternité</option>
          <option value="sans_solde">Congé sans solde</option>
          <option value="autre">Autre</option>
        </select>
      </div>
      <div class="col-md-4">
        <label class="form-label">Date de début</label>
        <input type="date" class="form-control" formControlName="dateDebut" />
      </div>
      <div class="col-md-4">
        <label class="form-label">Date de fin</label>
        <input type="date" class="form-control" formControlName="dateFin" />
      </div>

      <div class="col-12">
        <label class="form-label">Motif</label>
        <textarea class="form-control" rows="3" formControlName="motif"></textarea>
      </div>
    </div>

    <div class="mt-3 d-flex gap-2">
      <button type="submit" class="btn btn-primary" [disabled]="saving">
        <i class="bi bi-check-lg"></i> Enregistrer
      </button>
      <a routerLink="/conges" class="btn btn-outline-secondary">Annuler</a>
    </div>
  </form>
  </app-panel>
}
