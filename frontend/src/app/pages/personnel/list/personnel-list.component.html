<app-page-header title="Personnel" subtitle="Fiches agents et affectations.">
  <a routerLink="/personnel/new" class="btn btn-primary btn-sm">
    <i class="bi bi-plus-lg"></i> Nouvel agent
  </a>
</app-page-header>

@if (loading) {
  <p class="text-muted">Chargement...</p>
} @else if (error) {
  <div class="alert alert-danger">{{ error }}</div>
} @else {
  <app-data-table [rows]="personnels" [columns]="columns" emptyMessage="Aucun agent enregistré." searchPlaceholder="Rechercher un agent...">
    <ng-template appDataTableCell="matricule" let-personnel>{{ personnel.matricule || '—' }}</ng-template>
    <ng-template appDataTableCell="nomComplet" let-personnel>{{ personnel.nomComplet }}</ng-template>
    <ng-template appDataTableCell="fonction" let-personnel>{{ personnel.fonction }}</ng-template>
    <ng-template appDataTableCell="service" let-personnel>{{ serviceLabel(personnel) }}</ng-template>
    <ng-template appDataTableCell="statut" let-personnel>
      <span class="status-dot status-dot-{{ badgeClasseStatut(personnel.statut) }}">{{ labelsStatut[personnel.statut] }}</span>
    </ng-template>
    <ng-template appDataTableCell="actions" let-personnel>
      <a [routerLink]="['/personnel', personnel.id]" class="btn btn-sm btn-outline-primary">
        <i class="bi bi-pencil"></i>
      </a>
    </ng-template>
  </app-data-table>
}
