<div class="mb-4">
  <h4 class="mb-0 fw-bold">Tableau de bord — Congés</h4>
  <p class="text-muted small mb-0">Décisions et jouissances de congé en attente de traitement.</p>
</div>

@if (loading) {
  <p class="text-muted">Chargement...</p>
} @else if (error) {
  <div class="alert alert-danger">{{ error }}</div>
} @else if (data) {
  <div class="row g-3 mb-4">
    <div class="col-md-4 col-6">
      <app-stat-tile
        icon="bi-hourglass-split"
        [color]="data.enAttente.decisions > 0 ? 'warning' : 'success'"
        [value]="data.enAttente.decisions"
        label="Décisions en attente"
      />
    </div>
    <div class="col-md-4 col-6">
      <app-stat-tile
        icon="bi-hourglass-split"
        [color]="data.enAttente.jouissances > 0 ? 'warning' : 'success'"
        [value]="data.enAttente.jouissances"
        label="Jouissances en attente"
      />
    </div>
    <div class="col-md-4 col-6">
      <app-stat-tile icon="bi-calendar-check" color="primary" [value]="data.decisionsValides" label="Décisions valides (total)" />
    </div>
  </div>

  <app-panel title="Demandes traitées" icon="bi-bar-chart">
    <div panelActions>
      <div class="btn-group btn-group-sm">
        @for (p of periodes; track p) {
          <button
            type="button"
            class="btn"
            [class.btn-primary]="periode === p"
            [class.btn-outline-primary]="periode !== p"
            (click)="selectionnerPeriode(p)"
          >
            {{ labelsPeriode[p] }}
          </button>
        }
      </div>
    </div>
    <div class="row g-3 align-items-center">
      <div class="col-md-5">
        <app-chart type="doughnut" [data]="chartTraites" [height]="180" />
      </div>
      <div class="col-md-7">
        <div class="row g-3">
          <div class="col-6">
            <div class="border rounded p-3 text-center">
              <div class="text-muted small">Approuvées</div>
              <div class="fs-2 fw-bold text-success">{{ traitesPeriode().approuvees }}</div>
            </div>
          </div>
          <div class="col-6">
            <div class="border rounded p-3 text-center">
              <div class="text-muted small">Refusées</div>
              <div class="fs-2 fw-bold text-danger">{{ traitesPeriode().refusees }}</div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </app-panel>
}
