@if (loading) {
  <p class="text-muted">Chargement...</p>
} @else if (error) {
  <div class="alert alert-danger">{{ error }}</div>
  <a routerLink="/mon-espace/carte-professionnelle" class="btn btn-outline-secondary btn-sm">Retour</a>
} @else if (carte) {
  <app-page-header title="Ma carte professionnelle — {{ carte.numero }}">
    <a [href]="telechargerUrl" target="_blank" class="btn btn-success btn-sm">
      <i class="bi bi-download"></i> Télécharger
    </a>
    <a routerLink="/mon-espace/carte-professionnelle" class="btn btn-outline-secondary btn-sm">Retour</a>
  </app-page-header>

  <div class="alert alert-success d-flex align-items-center gap-2">
    <i class="bi bi-patch-check-fill"></i>
    Validée par {{ carte.valideeParNom }} le {{ carte.valideeLe | slice: 0 : 10 }}.
  </div>

  @if (pdfUrl) {
    <app-panel>
      <iframe [src]="pdfUrl" style="width: 100%; height: 75vh; border: none;" title="Aperçu de ma carte professionnelle"></iframe>
    </app-panel>
  }
}
