<app-page-header title="Mes documents administratifs" subtitle="Consultez et téléchargez vos documents administratifs archivés."></app-page-header>

@if (loading) {
  <p class="text-muted">Chargement...</p>
} @else if (error) {
  <div class="alert alert-danger">{{ error }}</div>
} @else {
  <app-file-grid
    [items]="items"
    emptyMessage="Aucun document administratif enregistré."
    searchPlaceholder="Rechercher un document..."
    (itemClick)="ouvrir($event)"
  />
}
