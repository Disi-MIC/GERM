<app-page-header title="Nouvelle demande de jouissance de congé"></app-page-header>

@if (error) {
  <div class="alert alert-danger">{{ error }}</div>
}

<app-panel>
<form [formGroup]="form" (ngSubmit)="submit()" style="max-width: 700px;">
  <div class="row g-3">
    <div class="col-md-6">
      <label class="form-label">Type de congé</label>
      <select class="form-select" formControlName="type">
        <option value="annuel">Congé annuel</option>
        <option value="maladie">Congé maladie</option>
        <option value="maternite_paternite">Congé maternité / paternité</option>
        <option value="sans_solde">Congé sans solde</option>
        <option value="autre">Autre</option>
      </select>
    </div>

    <div class="col-md-6">
      <label class="form-label">Ma décision de congé (obligatoire pour un congé annuel)</label>
      <select class="form-select" formControlName="decision">
        <option [ngValue]="null">Aucune</option>
        @for (decision of mesDecisionsValides; track decision.id) {
          <option [ngValue]="decision.id">{{ decision.numeroDecision }}</option>
        }
      </select>
    </div>

    <div class="col-md-6">
      <label class="form-label">Date de début</label>
      <input type="date" class="form-control" formControlName="dateDebut" />
    </div>
    <div class="col-md-6">
      <label class="form-label">Date de fin</label>
      <input type="date" class="form-control" formControlName="dateFin" />
    </div>

    <div class="col-12">
      <label class="form-label">Motif</label>
      <textarea class="form-control" rows="3" formControlName="motif"></textarea>
    </div>

    <div class="col-md-6">
      <label class="form-label">Pièce justificative 1</label>
      <input type="file" class="form-control" accept=".pdf,.jpg,.jpeg,.png" (change)="onFichier1Change($event)" />
    </div>
    <div class="col-md-6">
      <label class="form-label">Pièce justificative 2</label>
      <input type="file" class="form-control" accept=".pdf,.jpg,.jpeg,.png" (change)="onFichier2Change($event)" />
    </div>
  </div>

  <div class="mt-3 d-flex gap-2">
    <button type="submit" class="btn btn-primary" [disabled]="saving">
      <i class="bi bi-check-lg"></i> Enregistrer
    </button>
    <a routerLink="/mon-espace/conges" class="btn btn-outline-secondary">Annuler</a>
  </div>
</form>
</app-panel>
