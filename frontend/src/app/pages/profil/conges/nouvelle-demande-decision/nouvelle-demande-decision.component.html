<app-page-header title="Nouvelle demande de décision de congé"></app-page-header>

@if (error) {
  <div class="alert alert-danger">{{ error }}</div>
}

<app-panel>
<form [formGroup]="form" (ngSubmit)="submit()" style="max-width: 700px;">
  <div class="row g-3">
    <div class="col-md-6">
      <label class="form-label">Numéro de ma dernière décision (si connu)</label>
      <input type="text" class="form-control" formControlName="numeroDerniereDecision" />
    </div>
    <div class="col-md-6">
      <label class="form-label">Date de ma dernière décision (si connue)</label>
      <input type="date" class="form-control" formControlName="dateDerniereDecision" />
    </div>

    <div class="col-12">
      <label class="form-label">Motif</label>
      <textarea class="form-control" rows="3" formControlName="motif"></textarea>
    </div>

    <div class="col-md-6">
      <app-file-piece-input label="Pièce justificative 1" [(fichier)]="fichier1" />
    </div>
    <div class="col-md-6">
      <app-file-piece-input label="Pièce justificative 2" [(fichier)]="fichier2" />
    </div>
  </div>

  <div class="mt-3 d-flex gap-2">
    <button type="submit" class="btn btn-primary" [disabled]="saving">
      <i class="bi bi-check-lg"></i> Enregistrer
    </button>
    <a routerLink="/mon-espace/conges" class="btn btn-outline-secondary">Annuler</a>
  </div>
</form>
</app-panel>
