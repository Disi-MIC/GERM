<app-page-header title="Mes tickets">
  <a routerLink="/mon-espace/tickets/nouveau" class="btn btn-primary btn-sm">
    <i class="bi bi-plus-lg"></i> Nouveau ticket
  </a>
</app-page-header>

@if (loading) {
  <p class="text-muted">Chargement...</p>
} @else if (error) {
  <div class="alert alert-danger">{{ error }}</div>
} @else {
  <app-data-table [rows]="tickets" [columns]="columns" emptyMessage="Aucun ticket enregistré." searchPlaceholder="Rechercher un ticket...">
    <ng-template appDataTableCell="objet" let-ticket>{{ ticket.titre }}</ng-template>
    <ng-template appDataTableCell="materiel" let-ticket>{{ materielLabel(ticket) }}</ng-template>
    <ng-template appDataTableCell="priorite" let-ticket>{{ prioriteLabel(ticket) }}</ng-template>
    <ng-template appDataTableCell="statut" let-ticket>
      <span class="status-dot status-dot-{{ badgeClasseStatut(ticket.statut) }}">{{ statutLabel(ticket.statut) }}</span>
    </ng-template>
    <ng-template appDataTableCell="creeLe" let-ticket>{{ ticket.createdAt | slice: 0 : 10 }}</ng-template>
  </app-data-table>
}
