<app-page-header title="Nouveau mouvement de carrière"></app-page-header>

@if (error) {
  <div class="alert alert-danger">{{ error }}</div>
}

<app-panel>
<form [formGroup]="form" (ngSubmit)="submit()" style="max-width: 700px;">
  <div class="row g-3">
    <div class="col-12">
      <label class="form-label">Agent</label>
      <app-searchable-select formControlName="personnel" nullLabel="Sélectionner..." placeholder="Rechercher un agent..." [options]="personnelOptions" />
    </div>

    <div class="col-md-6">
      <label class="form-label">Type de mouvement</label>
      <select class="form-select" formControlName="typeMouvement">
        <option value="nomination">Nomination</option>
        <option value="mutation">Mutation</option>
        <option value="promotion">Promotion</option>
        <option value="autre">Autre</option>
      </select>
    </div>
    <div class="col-md-6">
      <label class="form-label">Date d'effet</label>
      <input type="date" class="form-control" formControlName="dateEffet" />
    </div>

    <div class="col-md-6">
      <label class="form-label">Service</label>
      <select class="form-select" formControlName="service">
        <option [ngValue]="null">Sélectionner...</option>
        @for (service of services; track service.id) {
          <option [ngValue]="service.id">{{ service.nom }}</option>
        }
      </select>
    </div>
    <div class="col-md-6">
      <label class="form-label">Fonction</label>
      <input type="text" class="form-control" formControlName="fonction" />
    </div>

    <div class="col-md-6">
      <label class="form-label">Grade</label>
      <input type="text" class="form-control" formControlName="grade" />
    </div>

    <div class="col-md-6">
      <label class="form-label">Numéro de décision</label>
      <input type="text" class="form-control" formControlName="numeroDecision" />
    </div>
    <div class="col-md-6">
      <label class="form-label">Date de décision</label>
      <input type="date" class="form-control" formControlName="dateDecision" />
    </div>

    <div class="col-12">
      <label class="form-label">Observations</label>
      <textarea class="form-control" rows="3" formControlName="observations"></textarea>
    </div>
  </div>

  <div class="mt-3 d-flex gap-2">
    <button type="submit" class="btn btn-primary" [disabled]="saving">
      <i class="bi bi-check-lg"></i> Enregistrer
    </button>
    <a routerLink="/carrieres" class="btn btn-outline-secondary">Annuler</a>
  </div>
</form>
</app-panel>
