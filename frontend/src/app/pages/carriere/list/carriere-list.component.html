<app-page-header title="Gestion des carrières" subtitle="Mouvements de carrière du personnel.">
  <a routerLink="/carrieres/new" class="btn btn-primary btn-sm">
    <i class="bi bi-plus-lg"></i> Nouveau mouvement
  </a>
</app-page-header>

@if (loading) {
  <p class="text-muted">Chargement...</p>
} @else if (error) {
  <div class="alert alert-danger">{{ error }}</div>
} @else {
  <app-data-table [rows]="mouvements" [columns]="columns" emptyMessage="Aucun mouvement." searchPlaceholder="Rechercher un mouvement...">
    <ng-template appDataTableCell="agent" let-mouvement>{{ agentLabel(mouvement) }}</ng-template>
    <ng-template appDataTableCell="type" let-mouvement>{{ labelsType[mouvement.typeMouvement] }}</ng-template>
    <ng-template appDataTableCell="service" let-mouvement>{{ serviceLabel(mouvement) }}</ng-template>
    <ng-template appDataTableCell="fonction" let-mouvement>{{ mouvement.fonction }}</ng-template>
    <ng-template appDataTableCell="dateEffet" let-mouvement>{{ mouvement.dateEffet | slice: 0 : 10 }}</ng-template>
    <ng-template appDataTableCell="actions" let-mouvement>
      <button type="button" class="btn btn-sm btn-outline-danger" (click)="supprimer(mouvement)">
        <i class="bi bi-trash"></i>
      </button>
    </ng-template>
  </app-data-table>
}
