<app-page-header title="Nouveau document administratif"></app-page-header>

@if (error) {
  <div class="alert alert-danger">{{ error }}</div>
}

<app-panel>
<form [formGroup]="form" (ngSubmit)="submit()" style="max-width: 700px;">
  <div class="row g-3">
    <div class="col-12">
      <label class="form-label">Agent</label>
      <select class="form-select" formControlName="personnel">
        <option [ngValue]="null">Sélectionner...</option>
        @for (personnel of personnels; track personnel.id) {
          <option [ngValue]="personnel.id">{{ personnel.nomComplet ?? personnel.matricule }}</option>
        }
      </select>
    </div>

    <div class="col-md-6">
      <label class="form-label">Type de document</label>
      <select class="form-select" formControlName="type">
        <option [ngValue]="null">Sélectionner...</option>
        @for (type of typesDocument; track type.id) {
          <option [ngValue]="type.id">{{ type.libelle }}</option>
        }
      </select>
    </div>
    <div class="col-md-6">
      <label class="form-label">Libellé</label>
      <input type="text" class="form-control" formControlName="libelle" placeholder="Ex. CNI n° 123456" />
    </div>

    <div class="col-md-6">
      <label class="form-label">Date du document</label>
      <input type="date" class="form-control" formControlName="dateDocument" />
    </div>
    <div class="col-md-6">
      <label class="form-label">Date d'expiration</label>
      <input type="date" class="form-control" formControlName="dateExpiration" />
      <div class="form-text">Laisser vide si le document n'a pas de date de validité.</div>
    </div>

    <div class="col-12">
      <label class="form-label">Fichier</label>
      <input type="file" class="form-control" (change)="onFichierChange($event)" />
    </div>

    <div class="col-12">
      <label class="form-label">Observations</label>
      <textarea class="form-control" rows="3" formControlName="observations"></textarea>
    </div>
  </div>

  <div class="mt-3 d-flex gap-2">
    <button type="submit" class="btn btn-primary" [disabled]="saving">
      <i class="bi bi-check-lg"></i> Enregistrer
    </button>
    <a routerLink="/documents-administratifs" class="btn btn-outline-secondary">Annuler</a>
  </div>
</form>
</app-panel>
