<app-page-header title="Nouveau changement de cartouche"></app-page-header>

@if (error) {
  <div class="alert alert-danger">{{ error }}</div>
}

<app-panel class="mb-3">
  <app-agent-ou-service-filtre (serviceIdChange)="onFiltreServiceChange($event)" />
</app-panel>

<app-panel>
<form [formGroup]="form" (ngSubmit)="submit()" style="max-width: 700px;">
  <div class="row g-3">
    <div class="col-12">
      <label class="form-label">Imprimante</label>
      <app-searchable-select formControlName="materiel" nullLabel="Sélectionner..." placeholder="Rechercher une imprimante..." [options]="materielOptions" />
    </div>

    <div class="col-md-6">
      <label class="form-label">Couleur</label>
      <select class="form-select" formControlName="couleur">
        <option [ngValue]="null">Sélectionner...</option>
        @for (couleur of couleurs; track couleur.value) {
          <option [ngValue]="couleur.value">{{ couleur.label }}</option>
        }
      </select>
    </div>
    <div class="col-md-6">
      <label class="form-label">Référence (optionnel)</label>
      <input type="text" class="form-control" formControlName="reference" placeholder="ex. 912XL" />
    </div>

    <div class="col-md-6">
      <label class="form-label">Date du changement</label>
      <input type="date" class="form-control" formControlName="dateChangement" />
    </div>

    <div class="col-12">
      <label class="form-label">Observations</label>
      <textarea class="form-control" rows="2" formControlName="observations"></textarea>
    </div>
  </div>

  <div class="mt-3 d-flex gap-2">
    <button type="submit" class="btn btn-primary" [disabled]="saving">
      <i class="bi bi-check-lg"></i> Enregistrer
    </button>
    <a routerLink="/cartouches-informatique" class="btn btn-outline-secondary">Annuler</a>
  </div>
</form>
</app-panel>
