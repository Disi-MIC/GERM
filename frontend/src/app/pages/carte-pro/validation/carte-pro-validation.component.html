<app-page-header title="Validation des cartes professionnelles" subtitle="Cartes en attente de validation par le RH Admin.">
  <a routerLink="/cartes-professionnelles" class="btn btn-outline-secondary btn-sm">Retour</a>
</app-page-header>

@if (loading) {
  <p class="text-muted">Chargement...</p>
} @else if (error) {
  <div class="alert alert-danger">{{ error }}</div>
} @else {
  <app-data-table [rows]="cartes" [columns]="columns" emptyMessage="Aucune carte en attente de validation." searchPlaceholder="Rechercher une carte...">
    <ng-template appDataTableCell="numero" let-carte>{{ carte.numero }}</ng-template>
    <ng-template appDataTableCell="agent" let-carte>{{ agentLabel(carte) }}</ng-template>
    <ng-template appDataTableCell="creeeLe" let-carte>{{ carte.createdAt | slice: 0 : 10 }}</ng-template>
    <ng-template appDataTableCell="actions" let-carte>
      <a [routerLink]="['/cartes-professionnelles', carte.id]" class="btn btn-sm btn-outline-secondary">
        <i class="bi bi-eye"></i> Aperçu
      </a>
      <button type="button" class="btn btn-sm btn-warning" (click)="valider(carte)">
        <i class="bi bi-patch-check"></i> Valider
      </button>
    </ng-template>
  </app-data-table>
}
