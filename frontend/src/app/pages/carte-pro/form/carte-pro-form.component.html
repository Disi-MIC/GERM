<app-page-header [title]="(carteId ? 'Modifier' : 'Nouvelle') + ' carte professionnelle'"></app-page-header>

@if (loading) {
  <p class="text-muted">Chargement...</p>
} @else {
  @if (error) {
    <div class="alert alert-danger">{{ error }}</div>
  }

  <app-panel>
  <form [formGroup]="form" (ngSubmit)="submit()" style="max-width: 700px;">
    <div class="row g-3">
      <div class="col-12">
        <label class="form-label">Agent</label>
        <app-searchable-select formControlName="personnel" nullLabel="Sélectionner..." placeholder="Rechercher un agent..." [options]="personnelOptions" />
      </div>

      <div class="col-md-6">
        <label class="form-label">Numéro de carte</label>
        <input type="text" class="form-control" formControlName="numero" />
      </div>
      <div class="col-md-6">
        <label class="form-label">Date de délivrance</label>
        <input type="date" class="form-control" formControlName="dateDelivrance" />
        <div class="form-text">La date d'expiration est calculée automatiquement (+5 ans).</div>
      </div>

      <div class="col-md-6">
        <label class="form-label">Statut</label>
        <select class="form-select" formControlName="statut">
          <option value="valide">Valide</option>
          <option value="perdue">Perdue</option>
          <option value="volee">Volée</option>
          <option value="annulee">Annulée</option>
        </select>
      </div>

      <div class="col-12">
        <label class="form-label">Observations</label>
        <textarea class="form-control" rows="3" formControlName="observations"></textarea>
      </div>
    </div>

    <div class="mt-3 d-flex gap-2">
      <button type="submit" class="btn btn-primary" [disabled]="saving">
        <i class="bi bi-check-lg"></i> Enregistrer
      </button>
      <a routerLink="/cartes-professionnelles" class="btn btn-outline-secondary">Annuler</a>
    </div>
  </form>
  </app-panel>
}
