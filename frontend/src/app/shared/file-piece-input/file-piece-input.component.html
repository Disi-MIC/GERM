<label class="form-label">
  {{ label }}
  @if (requis) {
    <span class="text-danger">*</span>
  }
</label>

@if (erreurScan) {
  <div class="alert alert-danger py-1 small mb-1">{{ erreurScan }}</div>
}

@if (scanDisponible) {
  <div class="d-flex gap-2">
    <button type="button" class="btn btn-outline-primary btn-sm flex-grow-1" [disabled]="scanEnCours" (click)="scannerDocument()">
      @if (scanEnCours) {
        <span class="spinner-border spinner-border-sm me-1"></span>
      } @else {
        <i class="bi bi-camera"></i>
      }
      Scanner
    </button>
    <button type="button" class="btn btn-outline-secondary btn-sm" (click)="fichierInput.click()" title="Choisir un fichier existant">
      <i class="bi bi-folder2-open"></i>
    </button>
    <input #fichierInput type="file" class="d-none" [attr.accept]="accept" (change)="onFichierChange(fichierInput)" />
  </div>
} @else {
  <input #fichierInput type="file" class="form-control" [attr.accept]="accept" (change)="onFichierChange(fichierInput)" />
}

@if (fichier) {
  <p class="text-muted small mb-0 mt-1">
    <i class="bi bi-paperclip"></i> {{ fichier.name }}
    <button type="button" class="btn btn-link btn-sm p-0 ms-2 text-danger" (click)="retirer()">Retirer</button>
  </p>
}
