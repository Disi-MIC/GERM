security:
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'

    providers:
        app_user_provider:
            entity:
                class: App\Entity\User
                property: email

    firewalls:
        dev:
            pattern: ^/(_(profiler|wdt)|css|images|js)/
            security: false

        # Firewall dédié à l'API consommée par le frontend Angular (rôles RH).
        # Authentification par cookie de session (comme "main"), pas de JWT :
        # json_login pose le cookie de session au login, réutilisé ensuite par
        # chaque requête XHR/fetch grâce à withCredentials côté Angular.
        api:
            pattern: ^/api
            lazy: true
            provider: app_user_provider
            json_login:
                check_path: api_login
                username_path: email
                password_path: password
            logout:
                path: api_logout
            # Anti brute-force : limite par login (email essayé) ET par IP —
            # sans ça, rien n'empêchait de tester des mots de passe en boucle
            # sur /api/login. 5 tentatives/15 min par identifiant tenté et
            # 20/min par IP (plus large : couvre plusieurs comptes testés
            # depuis la même adresse, ex. énumération d'emails).
            login_throttling:
                max_attempts: 5
                interval: '15 minutes'

        main:
            lazy: true
            provider: app_user_provider
            user_checker: App\Security\UserChecker
            custom_authenticator: App\Security\LoginFormAuthenticator
            # Même anti brute-force que le firewall "api", pour /admin/login.
            login_throttling:
                max_attempts: 5
                interval: '15 minutes'
            logout:
                path: app_logout
                target: app_login
            entry_point: App\Security\LoginFormAuthenticator

    # Hiérarchie des rôles : le superadmin hérite de tous les droits.
    # ROLE_RH_RESPONSABLE hérite des 3 rôles rubrique RH ; la restriction fine par
    # contrôleur se fait via #[IsGranted] sur un rôle unique, la hiérarchie
    # se charge de laisser passer les rôles englobants automatiquement.
    # L'informatique (parc, tickets, maintenance) est un domaine séparé du RH,
    # volontairement pas rattaché à ROLE_RH_RESPONSABLE. Séparation des tâches à
    # deux profils métier indépendants (ni l'un n'hérite de l'autre) : Stock
    # (matériel, affectations, maintenance) et Tickets (traitement des
    # incidents) ; ROLE_IT_RESPONSABLE (le directeur) hérite des deux, pour
    # garder tous les droits en plus de la validation qui lui est réservée.
    role_hierarchy:
        ROLE_AGENT: []
        ROLE_RH_PERSONNEL: [ROLE_AGENT]
        ROLE_RH_CONGE: [ROLE_AGENT]
        ROLE_RH_CARTE_PRO: [ROLE_AGENT]
        ROLE_RH_RESPONSABLE: [ROLE_RH_PERSONNEL, ROLE_RH_CONGE, ROLE_RH_CARTE_PRO]
        ROLE_IT_STOCK: [ROLE_AGENT]
        ROLE_IT_TICKETS: [ROLE_AGENT]
        ROLE_IT_RESPONSABLE: [ROLE_IT_STOCK, ROLE_IT_TICKETS]
        # Échelon hiérarchique de l'organigramme (chef de service < directeur
        # < autorité), orthogonal aux rôles métier RH/IT ci-dessus. L'accès à
        # "Aperçu de mon service"/"Aperçu de ma direction" reste indépendant
        # de ces rôles (voir Service::$responsable / Direction::$directeur) ;
        # seul l'aperçu global du Ministère est réservé à ROLE_AUTORITE.
        ROLE_RESPONSABLE_SERVICE: [ROLE_AGENT]
        ROLE_DIRECTION_MINISTERIELLE: [ROLE_RESPONSABLE_SERVICE]
        ROLE_AUTORITE: [ROLE_DIRECTION_MINISTERIELLE]
        ROLE_SUPERADMIN: [ROLE_RH_RESPONSABLE, ROLE_IT_RESPONSABLE, ROLE_AUTORITE, ROLE_ALLOWED_TO_SWITCH]

    access_control:
        - { path: ^/admin/login, roles: PUBLIC_ACCESS }
        - { path: ^/api/login, roles: PUBLIC_ACCESS }
        - { path: ^/api, roles: ROLE_AGENT }
        - { path: ^/admin, roles: ROLE_AGENT }

when@test:
    security:
        password_hashers:
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4
                time_cost: 3
                memory_cost: 10
