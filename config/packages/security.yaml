security:
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'

    providers:
        app_user_provider:
            entity:
                class: App\Entity\User
                property: email

    firewalls:
        dev:
            pattern: ^/(_(profiler|wdt)|css|images|js)/
            security: false

        main:
            lazy: true
            provider: app_user_provider
            user_checker: App\Security\UserChecker
            custom_authenticator: App\Security\LoginFormAuthenticator
            logout:
                path: app_logout
                target: app_login
            entry_point: App\Security\LoginFormAuthenticator

    # Hiérarchie des rôles : le superadmin hérite de tous les droits.
    # ROLE_ADMIN_RH hérite des 3 rôles rubrique RH ; la restriction fine par
    # contrôleur se fait via #[IsGranted] sur un rôle unique, la hiérarchie
    # se charge de laisser passer les rôles englobants automatiquement.
    role_hierarchy:
        ROLE_AGENT: []
        ROLE_ADMIN: [ROLE_AGENT]
        ROLE_RH_PERSONNEL: [ROLE_AGENT]
        ROLE_RH_CONGE: [ROLE_AGENT]
        ROLE_RH_CARTE_PRO: [ROLE_AGENT]
        ROLE_ADMIN_RH: [ROLE_RH_PERSONNEL, ROLE_RH_CONGE, ROLE_RH_CARTE_PRO]
        ROLE_SUPERADMIN: [ROLE_ADMIN, ROLE_ADMIN_RH, ROLE_ALLOWED_TO_SWITCH]

    access_control:
        - { path: ^/login, roles: PUBLIC_ACCESS }
        - { path: ^/admin, roles: ROLE_AGENT }

when@test:
    security:
        password_hashers:
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4
                time_cost: 3
                memory_cost: 10
