security:
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'

    providers:
        app_user_provider:
            entity:
                class: App\Entity\User
                property: email

    firewalls:
        dev:
            pattern: ^/(_(profiler|wdt)|css|images|js)/
            security: false

        # Firewall dédié à l'API consommée par le frontend Angular (rôles RH).
        # Authentification par cookie de session (comme "main"), pas de JWT :
        # json_login pose le cookie de session au login, réutilisé ensuite par
        # chaque requête XHR/fetch grâce à withCredentials côté Angular.
        api:
            pattern: ^/api
            lazy: true
            provider: app_user_provider
            json_login:
                check_path: api_login
                username_path: email
                password_path: password
            logout:
                path: api_logout

        main:
            lazy: true
            provider: app_user_provider
            user_checker: App\Security\UserChecker
            custom_authenticator: App\Security\LoginFormAuthenticator
            logout:
                path: app_logout
                target: app_login
            entry_point: App\Security\LoginFormAuthenticator

    # Hiérarchie des rôles : le superadmin hérite de tous les droits.
    # ROLE_ADMIN_RH hérite des 3 rôles rubrique RH ; la restriction fine par
    # contrôleur se fait via #[IsGranted] sur un rôle unique, la hiérarchie
    # se charge de laisser passer les rôles englobants automatiquement.
    # L'informatique (parc, tickets, maintenance) est un domaine séparé du RH,
    # volontairement pas rattaché à ROLE_ADMIN_RH. Séparation des tâches à
    # deux profils métier indépendants (ni l'un n'hérite de l'autre) : Stock
    # (matériel, affectations, maintenance) et Tickets (traitement des
    # incidents) ; ROLE_IT_RESPONSABLE (le directeur) hérite des deux, pour
    # garder tous les droits en plus de la validation qui lui est réservée.
    role_hierarchy:
        ROLE_AGENT: []
        ROLE_ADMIN: [ROLE_AGENT]
        ROLE_RH_PERSONNEL: [ROLE_AGENT]
        ROLE_RH_CONGE: [ROLE_AGENT]
        ROLE_RH_CARTE_PRO: [ROLE_AGENT]
        ROLE_ADMIN_RH: [ROLE_RH_PERSONNEL, ROLE_RH_CONGE, ROLE_RH_CARTE_PRO]
        ROLE_IT_STOCK: [ROLE_AGENT]
        ROLE_IT_TICKETS: [ROLE_AGENT]
        ROLE_IT_RESPONSABLE: [ROLE_IT_STOCK, ROLE_IT_TICKETS]
        ROLE_SUPERADMIN: [ROLE_ADMIN, ROLE_ADMIN_RH, ROLE_IT_RESPONSABLE, ROLE_ALLOWED_TO_SWITCH]

    access_control:
        - { path: ^/login, roles: PUBLIC_ACCESS }
        - { path: ^/api/login, roles: PUBLIC_ACCESS }
        - { path: ^/api, roles: ROLE_AGENT }
        - { path: ^/admin, roles: ROLE_AGENT }

when@test:
    security:
        password_hashers:
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4
                time_cost: 3
                memory_cost: 10
