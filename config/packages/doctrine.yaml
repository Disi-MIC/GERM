doctrine:
    dbal:
        url: '%env(resolve:DATABASE_URL)%'
        profiling_collect_backtrace: '%kernel.debug%'
        # GERM-026 : chiffrement en transit. germ-appdbserver expose déjà les
        # certificats auto-générés par MySQL 8 (have_ssl=YES, ssl_ca/ssl_cert/
        # ssl_key définis) mais le client ne les utilisait pas
        # (require_secure_transport=OFF côté serveur, non modifiable sans sudo
        # — voir docs/security/deploiement/GERM-026-chiffrement-mysql.md).
        # Sans accès en lecture à ca.pem (répertoire data 700 mysql:mysql,
        # hors de portée sans sudo), la vérification du certificat serveur
        # (VERIFY_CA/VERIFY_IDENTITY) n'est pas possible depuis l'application ;
        # SSL_VERIFY_SERVER_CERT=false chiffre le canal sans l'authentifier —
        # suffisant ici puisque MySQL n'écoute que sur 127.0.0.1 (risque
        # d'usurpation du serveur nul en pratique) et strictement supérieur à
        # une connexion en clair. Testé sur la base de développement
        # tunnelée (même serveur) : Ssl_cipher=TLS_AES_256_GCM_SHA384.
        options:
            !php/const PDO::MYSQL_ATTR_SSL_CIPHER: 'AES256-GCM-SHA384:AES128-GCM-SHA256'
            !php/const PDO::MYSQL_ATTR_SSL_VERIFY_SERVER_CERT: false
    orm:
        validate_xml_mapping: true
        naming_strategy: doctrine.orm.naming_strategy.underscore_number_aware
        auto_mapping: true
        # Ne peut plus être activé depuis DoctrineBundle 3 (l'auto-résolution
        # implicite d'entité depuis un paramètre de route a été retirée) — les
        # actions qui en dépendaient (ex. MeController::cartePdf()) utilisent
        # désormais explicitement #[MapEntity] à la place.
        controller_resolver:
            auto_mapping: false
        mappings:
            App:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/src/Entity'
                prefix: 'App\Entity'
                alias: App

when@test:
    doctrine:
        dbal:
            dbname_suffix: '_test%env(default::TEST_TOKEN)%'

when@prod:
    doctrine:
        orm:
            query_cache_driver:
                type: pool
                pool: doctrine.system_cache_pool
            result_cache_driver:
                type: pool
                pool: doctrine.result_cache_pool

    framework:
        cache:
            pools:
                doctrine.result_cache_pool:
                    adapter: cache.app
                doctrine.system_cache_pool:
                    adapter: cache.system
